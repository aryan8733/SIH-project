# One command to run the whole stack:  docker compose up --build
# Then seed the database:              docker compose exec backend npm run seed
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  ml:
    build: ./ml-service
    restart: unless-stopped
    ports: ["8000:8000"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: [mongo, ml]
    ports: ["5000:5000"]
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/agripulse
      JWT_SECRET: ${JWT_SECRET:-please_change_this_secret_in_production}
      ML_SERVICE_URL: http://ml:8000
      CORS_ORIGIN: "*"

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8080:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  mongo_data:
