input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--card)}

/* ---------------- deterministic RNG so the demo is identical every run ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------------- MOCK: 60 days of price history per crop per market ----------------
   API-HOOK: replace buildHistory() with GET /api/prices/history?crop&market
   backed by Agmarknet / eNAM ingestion.                                              */
const HISTORY = {};
(function buildHistory(){
  CROPS.forEach((c,ci)=>{
    MARKETS.forEach((m,mi)=>{
      const rnd = mulberry32(1000+ci*97+mi*13);
      const trend = (rnd()-0.42)*0.9;          // rupees/day drift
      let p = c.base*m.f*(0.94+rnd()*0.10);
      const arr=[];
      for(let d=59; d>=0; d--){
        const season = Math.sin((59-d)/9)* c.base*0.012;
        p = p + trend + season*0.35 + (rnd()-0.5)*c.base*0.014;
        const avg = Math.round(p);
        arr.push({ daysAgo:d, avg, min:Math.round(avg*0.955), max:Math.round(avg*1.05) });
      }
      HISTORY[c.id+"|"+m.id]=arr;
    });
  });
})();
const today = (cropId, marketId) => { const h=HISTORY[cropId+"|"+marketId]; return h[h.length-1]; };

/* ---------------- ENGINE 1: transport cost ---------------- */
function transport(km, qty, vehicle){
  const V = { tractor:{cap:12, mult:0.8, label:"Tractor trolley"},
              pickup:{cap:25, mult:1.0, label:"Pickup / Chhota hathi"},
              truck:{cap:90,  mult:1.6, label:"6-tyre truck"} };
  const v = V[vehicle] || V.pickup;
  const trips = Math.max(1, Math.ceil(qty / v.cap));
  const oneWay = km;
  const distance = S.rates.roundTrip ? oneWay*2 : oneWay;
  const total = distance * S.rates.perKm * v.mult * trips;
  return { total, perQtl: total/Math.max(qty,1), trips, distance, label:v.label, cap:v.cap };
}
function suggestVehicle(qty){ return qty<=12 ? "tractor" : qty<=25 ? "pickup" : "truck"; }

/* ---------------- ENGINE 2: net return ledger ---------------- */
function ledger(price, qty, km, vehicle, gradeAdj){
  const adj = {A:1.0, B:0.955, C:0.90}[gradeAdj] ?? 1;
  const effPrice = price*adj;
  const revenue = effPrice*qty;
  const tr = transport(km, qty, vehicle);
  const mandiFee = revenue*S.rates.mandiFeePct/100;
  const commission = revenue*S.rates.commissionPct/100;
  const labour = S.rates.labourPerQtl*qty;
  const packing = S.rates.packingPerQtl*qty;
  const costs = tr.total + mandiFee + commission + labour + packing;
  const net = revenue - costs;
  return { effPrice, revenue, transport:tr, mandiFee, commission, labour, packing, costs, net, netPerQtl:net/Math.max(qty,1) };
}

/* ---------------- ENGINE 3: price forecast (linear regression + demand) ----------------
   Mirrors ml-service/predict.py. Same maths as sklearn LinearRegression on day index.
   API-HOOK: POST http://localhost:8000/predict  {crop, market, history} -> {p7, lo, hi, r2} */
function regress(ys){
  const n=ys.length, xs=ys.map((_,i)=>i);
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0; for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2;}
  const slope=den?num/den:0, intercept=my-slope*mx;
  let ssr=0, sst=0; for(let i=0;i<n;i++){const p=intercept+slope*xs[i]; ssr+=(ys[i]-p)**2; sst+=(ys[i]-my)**2;}
  const r2 = sst ? 1-ssr/sst : 0;
  const resid = Math.sqrt(ssr/Math.max(n-2,1));
  return {slope, intercept, r2, resid, n};
}
function forecast(cropId, marketId, days=7){
  const h = HISTORY[cropId+"|"+marketId];
  const win = h.slice(-21).map(d=>d.avg);
  const r = regress(win);
  const m = MARKETS.find(x=>x.id===marketId);
  const demandPush = {High:1.0, Medium:0, Low:-0.8}[m.demand] * (CROPS.find(c=>c.id===cropId).base*0.0016);
  const cur = win[win.length-1];
  const point = cur + (r.slope+demandPush)*days;
  const band = Math.max(r.resid*1.28, cur*0.008) + Math.abs(r.slope)*days*0.35;
  return {
    current:cur, point, lo:point-band, hi:point+band,
    slope:r.slope, r2:r.r2, days,
    direction: r.slope>cur*0.0004 ? "rising" : r.slope< -cur*0.0004 ? "falling" : "flat",
    changePct: ((point-cur)/cur)*100
  };
}

/* ---------------- ENGINE 4: market ranking (net return, not top price) ---------------- */
function rankMarkets(cropId, qty, grade, vehicle){
  const rows = MARKETS.map(m=>{
    const p = today(cropId, m.id);
    const L = ledger(p.avg, qty, m.km, vehicle, grade);
    const f = forecast(cropId, m.id);
    const demandScore = {High:1, Medium:0.6, Low:0.25}[m.demand];
    // liquidity: a thin mandi may not absorb the lot on one day
    const absorb = Math.min(1, m.arrivals/(qty*8));
    const score = L.netPerQtl*(0.82+0.12*demandScore+0.06*absorb);
    return {market:m, price:p, L, f, demandScore, absorb, score};
  }).sort((a,b)=>b.score-a.score);
  return rows;
}

/* ---------------- ENGINE 5: buyer matching ---------------- */
function matchBuyers(cropId, qty, grade, farmerKm=0){
  const gr = {A:3,B:2,C:1};
  const pool = BUYERS.filter(b=>b.crops.includes(cropId));
  const bestPay = Math.max(1, ...pool.map(b=>b.pay));
  return pool.map(b=>{
    const cropPts = 35;
    const inRange = qty>=b.qtyMin && qty<=b.qtyMax;
    const qtyPts = inRange ? 20 : (qty<b.qtyMin ? Math.max(0, 20 - (b.qtyMin-qty)*1.6) : 4);
    const qualPts = gr[grade] >= gr[b.grade] ? 15 : Math.max(0, 15 - (gr[b.grade]-gr[grade])*9);
    const distPts = Math.max(0, 12 - Math.abs(b.km-farmerKm)/10);
    // A buyer paying a few percent less than the best offer loses far more than a few price points.
    const pricePts = Math.max(0, Math.min(10, 10*Math.pow(b.pay/bestPay, 12)));
    const trustPts = (b.verified?5:0) + Math.max(0,(b.rating-3.5)*2);
    const score = Math.max(10, Math.min(98, Math.round(cropPts+qtyPts+qualPts+distPts+pricePts+trustPts)));
    const L = ledger(b.pay, qty, b.km, suggestVehicle(qty), grade);
    return {buyer:b, score, inRange, L, parts:{cropPts,qtyPts,qualPts,distPts,pricePts,trustPts}};
  }).sort((a,b)=>b.score-a.score);
}

/* ---------------- ENGINE 6: sell-now vs wait ---------------- */
function timing(cropId, marketId, qty, grade){
  const f = forecast(cropId, marketId);
  const nowL = ledger(f.current, qty, MARKETS.find(m=>m.id===marketId).km, suggestVehicle(qty), grade);
  const laterL = ledger(f.point, qty, MARKETS.find(m=>m.id===marketId).km, suggestVehicle(qty), grade);
  const gain = laterL.net - nowL.net;
  const storagePerDay = 4*qty;                 // MOCK: ₹4/quintal/day warehouse + shrinkage
  const storageCost = storagePerDay*f.days;
  const netGain = gain - storageCost;
  let verdict, why;
  if(netGain > qty*30 && f.direction==="rising"){ verdict="wait"; why=`Forecast is rising. Holding 7 days adds about ${inr(gain)}, and ${inr(storageCost)} of storage still leaves ${inr(netGain)} extra.`; }
  else if(netGain < -qty*15){ verdict="now"; why=`Forecast is soft. Waiting 7 days is likely to cost about ${inr(Math.abs(netGain))} after storage.`; }
  else { verdict="now"; why=`The 7-day gain (${inr(gain)}) barely covers storage (${inr(storageCost)}). Locking the price now removes the risk.`; }
  return {f, gain, storageCost, netGain, verdict, why};
}

/* ---------------- tiny SVG charts (no external library) ---------------- */
function lineChart(series, opts={}){
  const w=opts.w||620, h=opts.h||190, pad={l:46,r:12,t:12,b:22};
  const all = series.flatMap(s=>s.data);
  const mn=Math.min(...all)*0.995, mx=Math.max(...all)*1.005;
  const X=i=>pad.l+i*(w-pad.l-pad.r)/(series[0].data.length-1);
  const Y=v=>pad.t+(h-pad.t-pad.b)*(1-(v-mn)/(mx-mn||1));
  let g="";
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3;g+=`<line class="gl" x1="${pad.l}" y1="${Y(v)}" x2="${w-pad.r}" y2="${Y(v)}"/><text x="4" y="${Y(v)+3}">₹${Math.round(v)}</text>`;}
  series.forEach(s=>{
    const d = s.data.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
    if(s.band){
      const up=s.band.hi.map((v,i)=>(i?"L":"M")+X(i+s.band.from).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
      const dn=s.band.lo.slice().reverse().map((v,i)=>"L"+X(s.band.from+s.band.lo.length-1-i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
      g+=`<path d="${up} ${dn} Z" fill="${s.color}" opacity=".16"/>`;
    }
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="${s.dash||""}"/>`;
  });
  if(opts.labels) opts.labels.forEach(l=>{ g+=`<text x="${X(l.i)}" y="${h-6}" text-anchor="middle">${esc(l.text)}</text>`; });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(opts.alt||"price chart")}">${g}</svg>`;
}
function barChart(items, opts={}){
  const w=opts.w||620, h=opts.h||Math.max(120, items.length*30+24), pad={l:130,r:56,t:8,b:8};
  const mx=Math.max(...items.map(i=>i.v))*1.02;
  let g="";
  items.forEach((it,i)=>{
    const y=pad.t+i*30, bw=(w-pad.l-pad.r)*(it.v/mx);
    g+=`<text x="0" y="${y+15}" style="fill:var(--ink)">${esc(it.k)}</text>`;
    g+=`<rect x="${pad.l}" y="${y+4}" width="${Math.max(2,bw)}" height="15" rx="4" fill="${it.color||"var(--green)"}"/>`;
    g+=`<text x="${pad.l+bw+6}" y="${y+16}">${esc(it.label||inr(it.v))}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(opts.alt||"comparison")}">${g}</svg>`;
}

function vPredict(){
  const sc=scenario();
  const mid = CTX.pm || rankMarkets(sc.crop,sc.qty,sc.grade,sc.vehicle)[0].market.id;
  const f=forecast(sc.crop,mid);
  const tm=timing(sc.crop,mid,sc.qty,sc.grade);
  const hist=HISTORY[sc.crop+"|"+mid].slice(-45).map(d=>d.avg);
  const fut=Array.from({length:7},(_,i)=>f.current+(f.point-f.current)*(i+1)/7);
  const band={from:hist.length-1, hi:[hist[hist.length-1],...fut.map((v,i)=>v+(f.hi-f.point)*(i+1)/7)], lo:[hist[hist.length-1],...fut.map((v,i)=>v-(f.point-f.lo)*(i+1)/7)]};
  const c=CROPS.find(x=>x.id===sc.crop);
  return shell(`${head("Price forecast","Linear regression on the last 21 days, adjusted for mandi demand")}
    ${lotControls()}
    <div class="card" style="margin-top:1rem">
      <div class="hstack" style="justify-content:space-between;flex-wrap:wrap">
        <div><label>${t('market')}</label><select onchange="CTX.pm=this.value;render()">${MARKETS.map(m=>`<option value="${m.id}" ${mid===m.id?'selected':''}>${esc(m.name)}</option>`).join("")}</select></div>
        <div style="text-align:right"><div class="muted">Today</div><div class="big num">${inr(f.current)}</div></div>
        <div style="text-align:right"><div class="muted">In 7 days</div><div class="big num" style="color:${f.changePct>=0?'var(--green)':'var(--danger)'}">${inr(f.lo)} – ${inr(f.hi)}</div></div>
      </div>
      <div style="margin-top:1rem">${lineChart([{data:[...hist,...fut],color:"var(--sky)",band}],{alt:"forecast",h:230,labels:[{i:0,text:"45 days ago"},{i:hist.length-1,text:"today"},{i:hist.length+6,text:"+7 days"}]})}</div>
      <p class="demo-note">Prediction is an estimate based on available data and should not be treated as a guaranteed future price.</p>
    </div>
    <div class="two" style="margin-top:1rem">
      <div class="card">
        <h3>Should you sell now or wait?</h3>
        <div style="margin-top:.6rem"><span class="tag ${tm.verdict==='wait'?'md':'hi'}" style="font-size:.95rem;padding:.3rem .9rem">${tm.verdict==='wait'?t('wait'):t('sellnow')}</span></div>
        <p style="margin-top:.7rem">${tm.why}</p>
        <div class="ledger" style="padding:0">
          <div class="row"><span>Net if you sell today</span><span class="num">${inr(ledger(f.current,sc.qty,MARKETS.find(m=>m.id===mid).km,sc.vehicle,sc.grade).net)}</span></div>
          <div class="row"><span>Net at the forecast price</span><span class="num">${inr(ledger(f.point,sc.qty,MARKETS.find(m=>m.id===mid).km,sc.vehicle,sc.grade).net)}</span></div>
          <div class="row minus"><span>7 days of storage and shrinkage</span><span class="num">− ${inr(tm.storageCost)}</span></div>
          <div class="row total"><span>Difference</span><span class="num" style="color:${tm.netGain>=0?'var(--green)':'var(--danger)'}">${tm.netGain>=0?"+":"−"} ${inr(Math.abs(tm.netGain))}</span></div>
        </div>
      </div>
      <div class="card">
        <h3>How the model reached this</h3>
        <div class="ledger" style="padding:0">
          <div class="row"><span>Training window</span><span>21 days, daily modal price</span></div>
          <div class="row"><span>Daily drift (slope)</span><span class="num">${f.slope>=0?"+":""}${inr1(f.slope)}/day</span></div>
          <div class="row"><span>Goodness of fit (R²)</span><span class="num">${f.r2.toFixed(2)}</span></div>
          <div class="row"><span>Mandi demand adjustment</span><span>${MARKETS.find(m=>m.id===mid).demand}</span></div>
          <div class="row"><span>Direction</span><span>${f.direction}</span></div>
          ${c.msp?`<div class="row"><span>MSP ${c.en} 2026-27</span><span class="num">${inr(c.msp)}</span></div>`:""}
        </div>
        <p class="muted" style="margin-top:.6rem">The production service runs the same model in scikit-learn with a Random Forest fallback for crops with seasonal breaks — <code>API-HOOK: POST /predict</code> on the FastAPI ML service.</p>
      </div>
    </div>`);
}

let REC=null;
function startVoice(){
  const box=$("voicebox"); const btn=$("micbtn");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ box.innerHTML = voicePanel("", "Your browser does not support speech recognition. Type your question instead."); return; }
  if(REC){ REC.stop(); REC=null; btn.classList.remove("rec"); return; }
  REC = new SR();
  REC.lang = LANG==="mr" ? "mr-IN" : LANG==="hi" ? "hi-IN" : "en-IN";
  REC.interimResults=false; REC.maxAlternatives=1;
  btn.classList.add("rec");
  box.innerHTML = voicePanel("", "Listening… say something like “meri soybean kahan bechna sahi rahega”.");
  REC.onresult = e => { const txt=e.results[0][0].transcript; answerVoice(txt); };
  REC.onerror = () => { btn.classList.remove("rec"); box.innerHTML = voicePanel("", "Could not hear that. Try again, or type the question."); };
  REC.onend = () => { btn.classList.remove("rec"); REC=null; };
  REC.start();
}
function voicePanel(said, msg, answer=""){
  return `<div class="card" style="margin-bottom:1rem;border-color:var(--sky)">
    <div class="hstack" style="justify-content:space-between"><h3>Ask by voice</h3><button class="btn sm ghost" onclick="document.getElementById('voicebox').innerHTML=''">Close</button></div>
    ${said?`<p style="margin-top:.5rem">You said: <b>“${esc(said)}”</b></p>`:""}
    ${msg?`<p class="muted">${esc(msg)}</p>`:""}
    ${answer}
    <div class="hstack" style="margin-top:.6rem"><input id="vq" placeholder="meri soybean kahan bechna sahi rahega" style="flex:1;min-width:200px"><button class="btn" onclick="answerVoice(document.getElementById('vq').value)">Ask</button></div>
  </div>`;
}
function answerVoice(txt){
  const q=(txt||"").toLowerCase();
  const found = CROPS.find(c => q.includes(c.en.toLowerCase()) || q.includes(c.hi) || q.includes(c.mr) ||
    (c.id==="soybean" && /soya/.test(q)) || (c.id==="wheat" && /gehu|गेहू|gehun/.test(q)) ||
    (c.id==="onion" && /pyaj|प्याज|kanda/.test(q)) || (c.id==="tomato" && /tamatar|टमाटर/.test(q)) || (c.id==="cotton" && /kapas|कपास/.test(q)));
  if(found){ CTX.crop=found.id; }
  const sc=scenario();
  const best=rankMarkets(sc.crop,sc.qty,sc.grade,sc.vehicle)[0];
  const tm=timing(sc.crop,best.market.id,sc.qty,sc.grade);
  const bm=matchBuyers(sc.crop,sc.qty,sc.grade,8)[0];
  const ans = `<div class="ledger" style="padding:0;margin-top:.6rem">
      <div class="row"><span>Sell your ${cropName(sc.crop)} at</span><span><b>${esc(best.market.name)}</b></span></div>
      <div class="row"><span>Price today</span><span class="num">${inr(best.price.avg)}/qtl</span></div>
      <div class="row"><span>After transport and charges</span><span class="num"><b>${inr(best.L.netPerQtl)}/qtl</b></span></div>
      <div class="row"><span>Sell now or wait</span><span>${tm.verdict==='wait'?'Wait about a week':'Sell now'}</span></div>
      <div class="row"><span>Best buyer</span><span>${esc(bm.buyer.company)} · ${bm.score}%</span></div>
    </div>`;
  const box=$("voicebox"); if(box) box.innerHTML = voicePanel(txt, "", ans);
  speak(`${cropName(sc.crop)} ${best.market.district} mandi mein bechiye. Net return ${Math.round(best.L.netPerQtl)} rupaye prati quintal.`);
  render2();
}
function speak(text){
  try{ if(!window.speechSynthesis) return; const u=new SpeechSynthesisUtterance(text); u.lang = LANG==="en"?"en-IN":"hi-IN"; speechSynthesis.speak(u); }catch(e){}
}

  return shell(`${head("Buyers", BUYERS.length+" registered · "+BUYERS.filter(b=>b.verified).length+" verified")}
    <div class="card scroll-x"><table><thead><tr><th>Company</th><th>Person</th><th>District</th><th>Crops</th><th>Range</th><th>Rating</th><th>Status</th></tr></thead><tbody>
      ${BUYERS.map(b=>`<tr><td><b>${esc(b.company)}</b></td><td>${esc(b.person)}</td><td>${esc(b.district)}</td><td class="muted">${b.crops.map(c=>cropName(c)).join(", ")}</td>
      <td class="num">${b.qtyMin}–${b.qtyMax}</td><td class="num">${b.rating}</td>
      <td><span class="tag ${b.verified?'hi':'bad'}">${b.verified?'verified':'unverified'}</span></td></tr>`).join("")}
    </tbody></table></div>`);
}
function vAdminVerify(){
  return shell(`${head("Buyer verification","Check the trade licence and GST before a buyer can bid")}
    <div class="list">
      ${BUYERS.map(b=>`<div class="card"><div class="hstack" style="justify-content:space-between;gap:1rem">
        <div><b>${esc(b.company)}</b><div class="muted">${esc(b.person)} · ${esc(b.district)} · ${esc(b.phone)}</div>
        <div class="muted">Buys ${b.crops.map(c=>cropName(c)).join(", ")} · ${b.qtyMin}–${b.qtyMax} qtl · grade ${b.grade}</div></div>
        <div class="hstack">${b.verified?'<span class="tag hi">verified</span><button class="btn sm ghost" onclick="setVerify(\''+b.id+'\',false)">Revoke</button>':'<span class="tag bad">pending</span><button class="btn sm" onclick="setVerify(\''+b.id+'\',true)">Verify</button>'}</div>
      </div></div>`).join("")}
    </div>`);
}
function setVerify(id,v){ const b=BUYERS.find(x=>x.id===id); b.verified=v; toast(v?"Buyer verified":"Verification revoked"); render(); }
function vAdminMarkets(){
  return shell(`${head("Markets", MARKETS.length+" mandis in the network")}
    <div class="card scroll-x"><table><thead><tr><th>Mandi</th><th>District</th><th>Distance from Dewas</th><th>Arrivals today</th><th>Demand</th><th>Price index</th></tr></thead><tbody>
      ${MARKETS.map(m=>`<tr><td><b>${esc(m.name)}</b><div class="muted">${m.lat}, ${m.lng}</div></td><td>${esc(m.district)}</td><td class="num">${m.km} km</td>
      <td class="num">${m.arrivals} qtl</td><td><span class="tag ${m.demand==='High'?'hi':m.demand==='Medium'?'md':'lo'}">${m.demand}</span></td><td class="num">${m.f.toFixed(3)}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="demo-note" style="margin-top:.8rem">Coordinates are stored so the farmer app can draw mandis on a Leaflet / OpenStreetMap layer and compute road distance through a routing API.</p>`);
}
function vAdminPrices(){
  const c=CTX.apc||"soybean";
  return shell(`${head("Price data","Daily min, modal and max per mandi")}
    <div class="hstack" style="margin-bottom:1rem">${CROPS.map(x=>`<button class="chip ${c===x.id?'on':''}" onclick="CTX.apc='${x.id}';render()">${x[LANG]||x.en}</button>`).join("")}</div>
    <div class="card scroll-x"><table><thead><tr><th>Mandi</th><th>Min</th><th>Modal</th><th>Max</th><th>7 days ago</th><th>Change</th><th>Records</th></tr></thead><tbody>
      ${MARKETS.map(m=>{const h=HISTORY[c+"|"+m.id]; const now=h[h.length-1], old=h[h.length-8];
        const ch=((now.avg-old.avg)/old.avg)*100; return `<tr><td>${esc(m.name)}</td><td class="num">${inr(now.min)}</td><td class="num"><b>${inr(now.avg)}</b></td>
        <td class="num">${inr(now.max)}</td><td class="num muted">${inr(old.avg)}</td>
        <td class="num" style="color:${ch>=0?'var(--green)':'var(--danger)'}">${ch>=0?"+":""}${ch.toFixed(1)}%</td><td class="num muted">${h.length}</td></tr>`;}).join("")}
    </tbody></table></div>
    <p class="muted" style="margin-top:.7rem">${MARKETS.length*CROPS.length*60} price records loaded in the demo dataset (60 days × 10 mandis × 5 crops).</p>`);
}
function vAdminTxn(){
  const value=S.txns.reduce((a,x)=>a+x.price*x.qty,0);
  return shell(`${head("Transactions", S.txns.length+" deals · "+inr(value)+" value · "+inr(value*S.rates.platformFeePct/100)+" platform revenue")}
    <div class="card scroll-x"><table><thead><tr><th>ID</th><th>Date</th><th>Lot</th><th>Farmer</th><th>Buyer</th><th>Crop</th><th>Qty</th><th>Price</th><th>Value</th><th>Fee</th></tr></thead><tbody>
      ${S.txns.map(x=>`<tr><td>${x.id}</td><td>${x.date}</td><td>${x.lot}</td><td>${esc((FARMERS.find(f=>f.id===x.farmerId)||{}).name||"")}</td>
        <td>${esc((BUYERS.find(b=>b.id===x.buyerId)||{}).company||"")}</td><td>${cropName(x.crop)}</td><td class="num">${x.qty}</td><td class="num">${inr(x.price)}</td>
        <td class="num"><b>${inr(x.price*x.qty)}</b></td><td class="num muted">${inr(x.price*x.qty*S.rates.platformFeePct/100)}</td></tr>`).join("")}
    </tbody></table></div>`);
}
function vAdminComplaints(){
  return shell(`${head("Complaints", S.complaints.length+" raised")}
    <div class="list">${S.complaints.map(c=>`<div class="card">
      <div class="hstack" style="justify-content:space-between"><b>${esc(c.from)} → ${esc(c.against)}</b><span class="tag ${c.status==='Open'?'bad':c.status==='Closed'?'hi':'md'}">${c.status}</span></div>
      <p style="margin:.4rem 0 0">${esc(c.text)}</p>
      <div class="hstack" style="margin-top:.6rem"><button class="btn sm" onclick="closeComplaint('${c.id}')">Mark resolved</button></div></div>`).join("")}</div>`);
}
function closeComplaint(id){ const c=S.complaints.find(x=>x.id===id); c.status="Closed"; save(); toast("Complaint closed"); render(); }
function vAdminAnalytics(){
  const byCrop={}; S.txns.forEach(x=>byCrop[x.crop]=(byCrop[x.crop]||0)+x.price*x.qty);
  const demand={}; BUYERS.forEach(b=>b.crops.forEach(c=>demand[c]=(demand[c]||0)+b.qtyMax));
  const idx = MARKETS.map(m=>({k:m.district, v:Math.round(today("soybean",m.id).avg), label:inr(today("soybean",m.id).avg)}));
  return shell(`${head("Analytics","Where the platform is creating value")}
    <div class="two">
      <div class="card"><h3>Buyer demand capacity by crop</h3>${barChart(Object.entries(demand).map(([k,v])=>({k:cropName(k),v,label:v+" qtl",color:"var(--sky)"})),{alt:"demand"})}</div>
      <div class="card"><h3>Soybean modal price across mandis</h3>${barChart(idx,{alt:"soybean price by mandi",color:"var(--gold)"})}</div>
    </div>
    <div class="card" style="margin-top:1rem"><h3>Impact of the recommendation</h3>
      <p class="muted">For a 10-quintal A-grade soybean lot from Dewas, this is the gap between selling at the mandi with the highest board price and selling where the ledger says to.</p>
      ${(()=>{const rows=rankMarkets("soybean",10,"A","tractor"); const byPrice=rows.slice().sort((a,b)=>b.price.avg-a.price.avg)[0];
        return `<div class="ledger" style="padding:0">
          <div class="row"><span>Highest board price · ${esc(byPrice.market.district)}</span><span class="num">${inr(byPrice.L.net)} net</span></div>
          <div class="row"><span>Recommended · ${esc(rows[0].market.district)}</span><span class="num">${inr(rows[0].L.net)} net</span></div>
          <div class="row total"><span>Extra income on one lot</span><span class="num" style="color:var(--green)">${inr(rows[0].L.net-byPrice.L.net)}</span></div></div>`;})()}
    </div>`);
}
function vAdminSettings(){
  const r=S.rates;
  return shell(`${head("Rates and settings","These feed every net-return calculation on the platform")}
    <div class="card" style="max-width:640px">
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <div><label>Transport rate (₹ per km)</label><input type="number" value="${r.perKm}" onchange="setRate('perKm',+this.value)"></div>
        <div><label>Mandi fee (%)</label><input type="number" step="0.1" value="${r.mandiFeePct}" onchange="setRate('mandiFeePct',+this.value)"></div>
        <div><label>Commission (%)</label><input type="number" step="0.1" value="${r.commissionPct}" onchange="setRate('commissionPct',+this.value)"></div>
        <div><label>Labour (₹ per quintal)</label><input type="number" value="${r.labourPerQtl}" onchange="setRate('labourPerQtl',+this.value)"></div>
        <div><label>Packing (₹ per quintal)</label><input type="number" value="${r.packingPerQtl}" onchange="setRate('packingPerQtl',+this.value)"></div>
        <div><label>Platform fee on buyer (%)</label><input type="number" step="0.1" value="${r.platformFeePct}" onchange="setRate('platformFeePct',+this.value)"></div>
      </div>
      <div class="hstack" style="margin-top:.9rem"><button class="chip ${r.roundTrip?'on':''}" onclick="setRate('roundTrip',!S.rates.roundTrip)">Charge return trip: ${r.roundTrip?"yes":"no"}</button></div>
      <div class="sep"></div>
      <h3>Effect right now</h3>
      ${(()=>{const L=ledger(today("soybean","m3").avg,10,68,"tractor","A");return `<div class="ledger" style="padding:0">
        <div class="row"><span>10 qtl soybean to Ujjain, tractor trolley</span><span class="num">${inr(L.transport.total)} transport</span></div>
        <div class="row total"><span>Net return</span><span class="num">${inr(L.net)}</span></div></div>`;})()}
      <div class="sep"></div>
      <button class="btn ghost" onclick="resetDemo()">Reset demo data</button>
    </div>`);
}
function setRate(k,v){ S.rates[k]=v; save(); toast("Rate updated"); render(); }
function resetDemo(){ S=seed(); save(); toast("Demo data reset"); go("a-dash"); }

/* ======================= misc UI ======================= */
function openModal(html){ MODAL=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card">${html}</div></div>`; render(); }
function closeModal(){ MODAL=null; render(); }
function langPicker(){ return `<select onchange="setLang(this.value)" style="width:auto;padding:.35rem .5rem" aria-label="Language">
  ${[["en","English"],["hi","हिंदी"],["mr","मराठी"]].map(([v,l])=>`<option value="${v}" ${LANG===v?'selected':''}>${l}</option>`).join("")}</select>`; }
function setLang(l){ LANG=l; try{localStorage.setItem("agripulse.lang",l)}catch(e){} render(); }
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{localStorage.setItem("agripulse.theme",next)}catch(e){}
}
function sproutSVG(){ return `<svg class="sprout" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <path d="M12 21V10" stroke="var(--green)" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 12C12 8.5 9.5 6 6 6c0 3.5 2.5 6 6 6Z" fill="var(--green)"/>
  <path d="M12 14c0-3.5 2.5-6 6-6 0 3.5-2.5 6-6 6Z" fill="var(--gold)"/></svg>`; }

const VIEWS = {
  home:vHome, about:vAbout, how:vHow, login:vLogin, register:vRegister,
  "f-dash":vFarmerDash, "f-addcrop":vAddCrop, "f-crops":vMyCrops, "f-prices":vPrices, "f-compare":vCompare,
  "f-predict":vPredict, "f-buyers":vBuyers, "f-lots":vLots, "f-offers":vOffers, "f-txn":vTxn, "f-alerts":vAlerts, "f-profile":vFProfile,
  "b-dash":vBuyerDash, "b-lots":vBuyerLots, "b-offers":vBuyerOffers, "b-search":vBuyerSearch, "b-txn":vBuyerTxn, "b-profile":vBuyerProfile,
  "a-dash":vAdminDash, "a-farmers":vAdminFarmers, "a-buyers":vAdminBuyers, "a-verify":vAdminVerify, "a-markets":vAdminMarkets,
  "a-prices":vAdminPrices, "a-txn":vAdminTxn, "a-complaints":vAdminComplaints, "a-analytics":vAdminAnalytics, "a-settings":vAdminSettings
};
function makeLot(cropId){ const c=S.crops.find(x=>x.id===cropId); CTX.crop=c.crop;CTX.qty=c.qty;CTX.grade=c.grade; go("f-lots"); setTimeout(openNewLot,120); }

function render(){
  const needsAuth = !["home","about","how","login","register"].includes(VIEW);
  if(needsAuth && !S.session){ VIEW="login"; }
  $("root") ? null : null;
  document.getElementById("root").innerHTML = (VIEWS[VIEW]||vHome)();
}
/* restore prefs */
try{ const l=localStorage.getItem("agripulse.lang"); if(l) LANG=l;
     const th=localStorage.getItem("agripulse.theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
render();
</script>
